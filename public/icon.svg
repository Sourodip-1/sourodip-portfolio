<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <!-- Deep Electric Blue Petal Gradient (Bold #0047FF with sapphire depth) -->
    <linearGradient id="trueBluePetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="20%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#0047FF"/>
      <stop offset="85%" stop-color="#0031B2"/>
      <stop offset="100%" stop-color="#001F7A"/>
    </linearGradient>

    <!-- Diamond Accent Gradient -->
    <linearGradient id="trueBlueDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#001F7A"/>
    </linearGradient>

    <!-- Central Ring Gradient -->
    <linearGradient id="trueBlueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047FF"/>
      <stop offset="100%" stop-color="#002280"/>
    </linearGradient>
  </defs>

  <g transform="translate(256,256)">
