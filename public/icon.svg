    <!-- Concentric Sacred Rings -->
    <!-- Outer Deep Blue Ring -->
    <circle cx="0" cy="0" r="100" fill="url(#trueBlueRing)" stroke="#001F7A" stroke-width="3"/>
    
    <!-- White Middle Ring -->
    <circle cx="0" cy="0" r="88" fill="#FFFFFF"/>
    
    <!-- Bold #0047FF Electric Blue Core -->
    <circle cx="0" cy="0" r="66" fill="#0047FF"/>
    
    <!-- Central Pure White Bindu Pearl -->
    <circle cx="0" cy="0" r="32" fill="#FFFFFF"/>
